name: Setup Bun
description: Install Bun and dependencies with cache

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
