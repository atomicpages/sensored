name: Setup Rust
description: >
  Install the stable Rust toolchain with rustfmt and clippy, cache crates/target,
  and optionally the Wasm toolchain (wasm32 target, wasm-bindgen CLI, wasm-opt).

inputs:
  targets:
    description: Extra rustup targets, comma-separated
    required: false
    default: ""
  wasm:
    description: Install the wasm32 target, the pinned wasm-bindgen CLI and wasm-opt (Linux x64 only)
    required: false
    default: "false"
  cache-key:
    description: Cache key suffix, so jobs that build different things keep separate caches
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        WASM: ${{ inputs.wasm }}
      run: |
        rustup toolchain install stable --profile minimal --component rustfmt,clippy
        rustup default stable
        if [ "$WASM" = "true" ]; then
          TARGETS="${TARGETS:+$TARGETS,}wasm32-unknown-unknown"
        fi
        if [ -n "$TARGETS" ]; then
          rustup target add ${TARGETS//,/ }
        fi

    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: crates -> target
        key: ${{ inputs.cache-key }}

    # The CLI must match the `=` pin on `wasm-bindgen` in crates/sensored-wasm.
    - name: Install wasm-bindgen and wasm-opt
      if: inputs.wasm == 'true'
      shell: bash
      env:
        BINARYEN_VERSION: "133"
      run: |
        WASM_BINDGEN_VERSION=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/sensored-wasm/Cargo.toml)
        if [ -z "$WASM_BINDGEN_VERSION" ]; then
          echo "wasm-bindgen pin not found in crates/sensored-wasm/Cargo.toml"
          exit 1
        fi
        BIN="$RUNNER_TEMP/wasm-tools"
        mkdir -p "$BIN"
        curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | tar xz -C "$BIN" --strip-components=1 "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
          | tar xz -C "$BIN" --strip-components=2 "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
        echo "$BIN" >> "$GITHUB_PATH"
        "$BIN/wasm-bindgen" --version
        "$BIN/wasm-opt" --version
