[package]
name = "sensored-wasm"
version = "0.1.0"
description = "WebAssembly bindings for sensored-core (wasm-bindgen)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3"
sensored-core = { path = "../sensored-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
# Pinned: the `wasm-bindgen` CLI that generates the JS glue must match exactly.
wasm-bindgen = "=0.2.129"
